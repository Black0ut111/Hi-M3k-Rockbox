name: Build Rockpod for FiiO M3K

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-m3k.yml"
      - "patches/**"
      - "scripts/**"
      - "theme-overlay/**"

permissions:
  contents: read

concurrency:
  group: m3k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out port files
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential flex libtool-bin \
            patch texinfo xz-utils zip unzip

      - name: Check out pinned Rockpod source
        run: |
          git init rockbox
          git -C rockbox remote add origin https://github.com/nuxcodes/rockpod.git
          git -C rockbox fetch --depth 1 origin 951d17c0575fbb61f3c585b5f0c3a0a941dcb10f
          git -C rockbox checkout --detach FETCH_HEAD
          echo "ROCKPOD_REVISION=$(git -C rockbox rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply M3K compatibility patches
        run: |
          if compgen -G "patches/*.patch" > /dev/null; then
            for patch_file in patches/*.patch; do
              git -C rockbox apply "../$patch_file"
            done
          fi

      - name: Cache MIPS cross compiler
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/rockbox-toolchain
          key: rockbox-mipsel-elf-gcc-9.5.0-binutils-2.38-v2

      - name: Build MIPS cross compiler
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local"
          export RBDEV_PREFIX="$HOME/.local/rockbox-toolchain"
          export RBDEV_BUILD="${{ runner.temp }}/rbdev-build"
          export RBDEV_DOWNLOAD="${{ runner.temp }}/rbdev-download"
          rockbox/tools/rockboxdev.sh --target=i

      - name: Add cross compiler to PATH
        run: echo "$HOME/.local/rockbox-toolchain/bin" >> "$GITHUB_PATH"

      - name: Configure native FiiO M3K build
        run: |
          mkdir build-m3k
          cd build-m3k
          ../rockbox/tools/configure --target=fiiom3k --type=n

      - name: Build firmware package
        run: |
          make -C build-m3k -j2
          make -C build-m3k zip
          mkdir package
          unzip -q build-m3k/rockbox.zip -d package
          mkdir -p theme-overlay/.rockbox/fonts
          unzip -p theme-assets/chinese-font.zip > theme-overlay/.rockbox/fonts/16-WenQangYi-Unibit.fnt
          cp -a theme-overlay/. package/
          (cd package && zip -qr ../rockpod-fiiom3k-alpha1.zip .rockbox)
          sha256sum rockpod-fiiom3k-alpha1.zip > SHA256SUMS.txt
          printf '%s\n' "$ROCKPOD_REVISION" > ROCKPOD_REVISION.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: rockpod-fiiom3k-alpha1
          path: |
            rockpod-fiiom3k-alpha1.zip
            SHA256SUMS.txt
            ROCKPOD_REVISION.txt
          if-no-files-found: error
          retention-days: 14
